# Shannon pentest - consumes the published Shannon CI/CD component.
#
# Run manually: Build > Pipelines > "Run pipeline" (the target is an ephemeral
# staging URL, so we don't scan on every push).
#
# Requires SHANNON_AI_API_KEY as a masked CI/CD variable (Settings > CI/CD > Variables),
# and a self-managed shell-executor runner (non-root, Docker + Node) tagged "shannon".
include:
  - component: gitlab.com/naomi-group5355034/shannon-action/scan@1.0.1
    inputs:
      url: https://0072-103-125-154-19.ngrok-free.app
      config: .shannon/js.yaml

# Re-declare the component's job: run manually, route to the shell-executor runner
# via its "shannon" tag, and give the scan room to finish.
shannon-scan:
  timeout: 2h
  tags:
    - shannon
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
